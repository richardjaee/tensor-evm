[package]
name = "tensor-precompile"
description = "EVM precompile exposing deterministic integer matmul"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tensor-kernel = { path = "../tensor-kernel" }
# The whole-layer precompile is the reference implementation, called directly rather than
# reimplemented — which is the only way a fused layer cannot disagree with the model it is
# supposed to be.
tensor-model = { path = "../tensor-model" }
revm = "42"

[dev-dependencies]
serde_json = "1"
tensor-model = { path = "../tensor-model" }
