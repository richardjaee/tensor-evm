[workspace]
members = ["crates/tensor-kernel", "crates/tensor-precompile", "crates/tensor-model", "crates/tensor-node"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/richardjaee/tensor-evm"
rust-version = "1.91"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
