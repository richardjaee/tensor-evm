[workspace]
members = [
    "crates/tensor-kernel",
    "crates/tensor-precompile",
    "crates/tensor-model",
    "crates/tensor-node",
    "crates/tensor-cli",
]
resolver = "2"
# reth is hundreds of crates and its own workspace. Keeping it out means `cargo test` and
# `verify.sh` stay quick enough that nobody is tempted to skip them.
exclude = ["crates/tensor-reth"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/richardjaee/tensor-evm"
rust-version = "1.91"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
