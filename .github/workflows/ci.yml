name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The Solidity tests compile the contracts and run them against the EVM that
      # carries the precompile. Without solc they fail rather than skip, deliberately:
      # a silently absent end-to-end test is how this project already lost a day to an
      # inner loop that appeared free because none of its calls reached anything.
      - name: install solc
        uses: pontem-network/get-solc@master
        with:
          version: v0.8.30

      # The same script a developer runs, rather than a list that can drift from it:
      # formatting, lint, the tests, the pinned determinism digest at two thread counts,
      # and a model generating tokens on a node over JSON-RPC.
      #
      # Everything runs in release. Determinism is the property the whole design rests on
      # and the optimiser is free to reassociate, so a debug-only check would be checking
      # something nobody runs.
      #
      # This job is also a standing cross-architecture check. The digest is pinned to a
      # value measured on aarch64/macOS, and CI is x86_64/Linux — so every push re-tests
      # the claim that the arithmetic does not depend on either.
      - run: ./verify.sh
